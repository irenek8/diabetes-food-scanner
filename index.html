<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>GlucoScan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;700&display=swap" rel="stylesheet"/>
    <style>
      body { font-family: 'Raleway', sans-serif; background: #f0fdf4; }
      .section-card { background: #ffffff; border-radius: 12px; padding: 14px; margin-bottom: 10px; border: 1px solid #e5e7eb; }
      .section-title { font-weight: 700; color: #15803d; }
    </style>
  </head>
  <body class="p-6 max-w-lg mx-auto">

    <header class="mb-6 text-center">
      <h1 class="text-xl font-bold text-green-700">GlucoScan</h1>
    </header>

    <div class="bg-white p-4 rounded-xl shadow-sm border mb-4">
      <input type="password" id="apiKey" placeholder="Paste Gemini API Key" class="w-full border p-2 rounded mb-3"/>
      <input type="file" accept="image/*" id="foodImage" class="w-full mb-3"/>
      <button onclick="analyzeFood()" class="w-full bg-green-600 text-white py-2 rounded font-bold">Analyze Food</button>
    </div>

    <div id="confirmCard" class="hidden bg-white p-4 rounded-xl shadow-sm border mb-4 text-center">
      <p class="text-sm text-gray-500 mb-1">Identified as:</p>
      <p id="identifiedFood" class="text-lg font-bold text-green-700 mb-3"></p>
      <div class="flex gap-2">
        <button onclick="confirmFood()" class="flex-1 bg-green-600 text-white py-2 rounded font-bold">Yes, analyze it</button>
        <button onclick="showCorrection()" class="flex-1 bg-gray-200 text-gray-700 py-2 rounded font-bold">No, correct it</button>
      </div>
    </div>

    <div id="correctionCard" class="hidden bg-white p-4 rounded-xl shadow-sm border mb-4">
      <input type="text" id="manualFood" placeholder="Type food manually..." class="w-full border p-2 rounded mb-2"/>
      <button onclick="analyzeManual()" class="w-full bg-blue-600 text-white py-2 rounded font-bold">Analyze This Instead</button>
    </div>

    <div id="resultCard" class="hidden bg-white p-4 rounded-xl shadow-sm border">
      <h2 class="font-bold text-gray-700 mb-3 pb-2 border-b">Analysis Result</h2>
      <div id="outputSections"></div>
    </div>

    <script>
      let confirmedFoodName = '';

      // 1. Identify food from image
      async function analyzeFood() {
        const apiKey = document.getElementById('apiKey').value;
        const file = document.getElementById('foodImage').files[0];
        const base64Image = await toBase64(file);

        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{
              parts: [
                { text: 'Identify the food in this image. Return ONLY the name.' },
                { inline_data: { mime_type: file.type, data: base64Image } }
              ]
            }]
          })
        });

        const data = await response.json();
        confirmedFoodName = data.candidates[0].content.parts[0].text.trim();

        document.getElementById('identifiedFood').textContent = confirmedFoodName;
        document.getElementById('confirmCard').classList.remove('hidden');
      }

      // 2a. User clicks 'Yes'
      async function confirmFood() {
        document.getElementById('confirmCard').classList.add('hidden');
        await runFullAnalysis(confirmedFoodName);
      }

      // 2b. User clicks 'No'
      function showCorrection() {
        document.getElementById('confirmCard').classList.add('hidden');
        document.getElementById('correctionCard').classList.remove('hidden');
      }

      // 3. User types fallback text manually
      async function analyzeManual() {
        const manualFood = document.getElementById('manualFood').value;
        document.getElementById('correctionCard').classList.add('hidden');
        await runFullAnalysis(manualFood);
      }

      // 4. Request full nutritional breakdowns
      async function runFullAnalysis(foodName) {
        const apiKey = document.getElementById('apiKey').value;
        document.getElementById('resultCard').classList.remove('hidden');

        const prompt = `Provide info for ${foodName} in this format:
[FOOD IDENTIFIED] name
[GLYCEMIC INDEX] info
[BLOOD GLUCOSE IMPACT] info
[RECOMMENDED PORTION SIZE] info
[SAFE TO EAT?] info
[HEALTHIER ALTERNATIVES] info`;

        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
        });

        const data = await response.json();
        renderSections(data.candidates[0].content.parts[0].text);
      }

      // 5. Parse output text blocks into visual boxes
      function renderSections(rawText) {
        const keys = ['FOOD IDENTIFIED', 'GLYCEMIC INDEX', 'BLOOD GLUCOSE IMPACT', 'RECOMMENDED PORTION SIZE', 'SAFE TO EAT?', 'HEALTHIER ALTERNATIVES'];
        const output = document.getElementById('outputSections');
        output.innerHTML = '';

        keys.forEach(key => {
          const regex = new RegExp(`\\[${key}\\]([\\s\\S]*?)(?=\\[|$)`, 'i');
          const match = rawText.match(regex);
          if (match) {
            const card = document.createElement('div');
            card.className = 'section-card';
            card.innerHTML = `<div class="section-title">${key}</div><div>${match[1].trim()}</div>`;
            output.appendChild(card);
          }
        });
      }

      function toBase64(file) {
        return new Promise((resolve) => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result.split(',')[1]);
          reader.readAsDataURL(file);
        });
      }
    </script>
  </body>
</html>
